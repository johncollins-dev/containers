services:
  kavita:
    image: jvmilazz0/kavita:latest
    container_name: kavita
    user: ${UID}:${GID}
    networks:
      - proxy
    ports:
      - 5000:5000
    volumes:
      - ${CONFIG_DIR}:/kavita/config
      - ${BOOKS_DIR}:/books
    restart: 'unless-stopped'

networks:
  proxy:
    external: true
    
